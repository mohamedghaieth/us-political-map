# Optional PostgreSQL for persistent storage (the app defaults to a local SQLite file).
#   docker compose up -d db
#   export DATABASE_URL=postgresql+psycopg2://usamap:usamap@localhost:5432/usamap
# NOTE: the Postgres path is configured but was not exercised in the development environment.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: usamap
      POSTGRES_PASSWORD: usamap
      POSTGRES_DB: usamap
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
